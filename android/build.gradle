plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.referralpanda'
version = '0.1.0'

expoModule {
  v2 true
}

android {
  namespace "com.referralpanda.reactnative"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  // Google Play's Install Referrer: which link an install came from, read on the device.
  implementation 'com.android.installreferrer:installreferrer:2.2'
}
